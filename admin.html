<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ระบบบริหารจัดการ · ลอยกระทงออนไลน์ ทต.คลองตำหรุ</title>
<link rel="icon" href="logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Mitr',sans-serif;background:#0b1440;color:#fff;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#071030;border-bottom:1px solid rgba(62,230,255,.4);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header img{height:40px}
header h1{font-size:18px;color:#ffd77a;flex:1;min-width:200px}
.btn{font:inherit;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
.gold{background:linear-gradient(135deg,#ffe39a,#f5b942);color:#2b1600;font-weight:600}
.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.red{background:#d9383a;color:#fff}
.gray{background:#556;color:#fff}
.green{background:#2f9e5b;color:#fff}
#login{max-width:360px;margin:12vh auto;padding:26px;background:#101c52;border:1px solid rgba(255,215,122,.45);border-radius:18px;text-align:center}
#login img{height:80px;margin-bottom:10px}
#login h2{color:#ffd77a;font-size:20px;margin-bottom:14px}
input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;outline:none}
input:focus{border-color:#ffd77a}
#login .btn{width:100%;margin-top:12px;padding:11px}
#err{color:#ff8a8a;font-size:14px;margin-top:10px;min-height:20px}
#app{display:none;padding:14px 18px 40px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input{max-width:320px}
.stat{background:rgba(255,255,255,.07);border-radius:10px;padding:7px 12px;font-size:14px}
.stat b{color:#ffd77a}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;vertical-align:middle}
th{color:#ffd77a;font-weight:400;position:sticky;top:64px;background:#0b1440}
td.ph img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #ffd77a}
td.kt img{width:48px;height:48px;object-fit:contain}
td.w{max-width:380px;word-break:break-word}
tr.hid{opacity:.45}
.tag{font-size:12px;padding:2px 8px;border-radius:8px}
.tag.on{background:#2f9e5b}.tag.off{background:#777}
.acts{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101c52;border:1px solid #ffd77a;padding:10px 18px;border-radius:20px;display:none;z-index:9}
@media(max-width:700px){th:nth-child(5),td:nth-child(5),th:nth-child(2),td:nth-child(2){display:none}}
</style>
</head>
<body>
<div id="login">
  <img src="logo.webp" alt="">
  <h2>ระบบบริหารจัดการ<br>ลอยกระทงออนไลน์ ๒๕๖๙</h2>
  <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password">
  <button class="btn gold" id="go">เข้าสู่ระบบ</button>
  <div id="err"></div>
</div>

<header id="hd" style="display:none">
  <img src="logo.webp" alt=""><h1>ระบบบริหารจัดการ · ลอยกระทงออนไลน์ ๒๕๖๙</h1>
  <a class="btn ghost" href="./" target="_blank">ดูหน้าเว็บ</a>
  <button class="btn ghost" id="out">ออกจากระบบ</button>
</header>
<div id="app">
  <div class="bar">
    <input id="q" placeholder="🔎 ค้นหาชื่อ / คำอธิษฐาน">
    <span class="stat">ทั้งหมด <b id="sAll">0</b></span>
    <span class="stat">แสดงอยู่ <b id="sOn">0</b></span>
    <span class="stat">ซ่อนอยู่ <b id="sOff">0</b></span>
    <span class="stat">ตัวนับหน้าเว็บ <b id="sTot">0</b></span>
    <button class="btn ghost" id="csv">⬇ ส่งออก CSV</button>
  </div>
  <table>
    <thead><tr><th>รูป</th><th>กระทง</th><th>ชื่อ</th><th>คำอธิษฐาน</th><th>เวลา</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
var CONFIG = { apiKey: "AIzaSyC1bgFPWYius-4Q1IJ0j61SjBMs6tG9t48", authDomain: "tanakrid90-46d47.firebaseapp.com", databaseURL: "https://tanakrid90-46d47-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "tanakrid90-46d47", appId: "1:824337779321:web:dcf5243cb80ea9ee7022a8" };
var ADMIN_EMAIL = "admin@klongtamru-smartcity.in.th"; // บัญชีผู้ดูแลใน Firebase Authentication (รหัสผ่านไม่ได้เก็บในไฟล์นี้)
firebase.initializeApp(CONFIG);
var auth = firebase.auth(), db = firebase.database(), REF = db.ref("krathong"), TOT = db.ref("stats/total");
var $ = function (id) { return document.getElementById(id); };
var ALL = [];
function toast(t) { var e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(function () { e.style.display = "none"; }, 3000); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function okPhoto(u) { return typeof u === "string" && /^data:image\/jpeg;base64,[\w+\/=]+$/.test(u); }
function art(k) { return k.img && /^k\d\d$/.test(k.img) ? '<img src="krathong/' + k.img + '.webp" alt="">' : "🪷"; }

$("go").onclick = function () {
  $("err").textContent = "";
  auth.signInWithEmailAndPassword(ADMIN_EMAIL, $("pw").value).catch(function (e) {
    $("err").textContent = /wrong-password|invalid-credential|invalid-login/.test(e.code) ? "รหัสผ่านไม่ถูกต้อง" :
      /user-not-found/.test(e.code) ? "ยังไม่ได้สร้างบัญชีผู้ดูแลใน Firebase" :
      /too-many-requests/.test(e.code) ? "ลองผิดหลายครั้ง กรุณารอสักครู่" : "เข้าสู่ระบบไม่สำเร็จ (" + e.code + ")";
  });
};
$("pw").onkeydown = function (e) { if (e.key === "Enter") $("go").click(); };
$("out").onclick = function () { auth.signOut(); };

auth.onAuthStateChanged(function (u) {
  var ok = u && u.email === ADMIN_EMAIL;
  $("login").style.display = ok ? "none" : "block";
  $("hd").style.display = ok ? "flex" : "none"; $("app").style.display = ok ? "block" : "none";
  if (ok) start(); else { REF.off(); TOT.off(); $("pw").value = ""; }
});

function start() {
  REF.orderByChild("created_at").limitToLast(1000).on("value", function (s) {
    ALL = []; s.forEach(function (c) { var v = c.val() || {}; v.id = c.key; ALL.push(v); });
    ALL.reverse(); render();
  }, function (e) { toast("โหลดข้อมูลไม่สำเร็จ: " + e.code); });
  TOT.on("value", function (s) { $("sTot").textContent = s.val() || 0; });
}

function render() {
  var q = $("q").value.trim().toLowerCase(), on = 0;
  var list = ALL.filter(function (k) { if (k.approved !== false) on++; return !q || (String(k.name) + " " + String(k.wish)).toLowerCase().indexOf(q) > -1; });
  $("sAll").textContent = ALL.length; $("sOn").textContent = on; $("sOff").textContent = ALL.length - on;
  $("rows").innerHTML = list.map(function (k) {
    var hid = k.approved === false, t = k.created_at ? new Date(k.created_at).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short" }) : "";
    return '<tr class="' + (hid ? "hid" : "") + '" data-id="' + esc(k.id) + '">' +
      '<td class="ph">' + (okPhoto(k.photo) ? '<img src="' + k.photo + '" alt="">' : "") + '</td>' +
      '<td class="kt">' + art(k) + '</td><td>' + esc(k.name) + '</td><td class="w">' + esc(k.wish) + '</td><td>' + t + '</td>' +
      '<td><span class="tag ' + (hid ? "off" : "on") + '">' + (hid ? "ซ่อน" : "แสดง") + '</span></td>' +
      '<td><div class="acts"><button class="btn ' + (hid ? "green" : "gray") + '" data-a="tog">' + (hid ? "แสดง" : "ซ่อน") + '</button>' +
      '<button class="btn red" data-a="del">ลบ</button></div></td></tr>';
  }).join("") || '<tr><td colspan="7" style="text-align:center;opacity:.7;padding:30px">ไม่มีข้อมูล</td></tr>';
}
$("q").oninput = render;

$("rows").onclick = function (e) {
  var b = e.target.closest("button"); if (!b) return;
  var id = b.closest("tr").getAttribute("data-id"), k = ALL.filter(function (x) { return x.id === id; })[0]; if (!k) return;
  if (b.getAttribute("data-a") === "tog") {
    REF.child(id).child("approved").set(k.approved === false).then(function () { toast(k.approved === false ? "แสดงกระทงแล้ว" : "ซ่อนกระทงแล้ว"); })
      .catch(function (e) { toast("ไม่สำเร็จ: " + e.code); });
  } else if (confirm('ลบกระทงของ "' + k.name + '" ถาวร?\n(กู้คืนไม่ได้)')) {
    REF.child(id).remove().then(function () {
      TOT.transaction(function (n) { return Math.max(0, (n || 0) - 1); }); toast("ลบกระทงแล้ว");
    }).catch(function (e) { toast("ลบไม่สำเร็จ: " + e.code); });
  }
};

$("csv").onclick = function () {
  var rows = [["id", "เวลา", "ชื่อ", "คำอธิษฐาน", "แบบกระทง", "สถานะ"]].concat(ALL.map(function (k) {
    return [k.id, k.created_at ? new Date(k.created_at).toLocaleString("th-TH") : "", k.name, k.wish, k.img || k.base || "", k.approved === false ? "ซ่อน" : "แสดง"];
  }));
  var csv = "﻿" + rows.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "loykrathong-2569.csv"; a.click();
};
</script>
</body>
</html>
