<style>
:root{--cy:#3ee6ff;--gold:#ffd77a;--gold2:#f5b942;--panel:rgba(10,16,44,.92);--hz:63%}

#piles{position:absolute;inset:0;background:transparent center bottom/cover no-repeat;pointer-events:none;z-index:3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#040817;font-family:'Mitr',sans-serif;color:#fff}
#scene{position:fixed;inset:0;overflow:hidden}
/* sky */

.moon{position:absolute;top:7%;right:12%;width:clamp(60px,9vw,110px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fffdf0,#fff0c2 55%,#efd28a);box-shadow:0 0 60px 22px rgba(255,236,170,.35),0 0 180px 80px rgba(255,220,140,.12)}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 58%,rgba(180,150,90,.25) 0 9%,transparent 10%),radial-gradient(circle at 35% 66%,rgba(180,150,90,.2) 0 6%,transparent 7%),radial-gradient(circle at 55% 30%,rgba(180,150,90,.18) 0 5%,transparent 6%)}
/* temple */
.temple{position:absolute;left:0;width:100%;height:42vh;bottom:calc(100% - var(--hz));}
.temple svg{width:100%;height:100%;display:block}
.refl{position:absolute;left:0;width:100%;height:42vh;top:var(--hz);transform:scaleY(-1);transform-origin:center;opacity:.38;filter:blur(2.5px) saturate(1.3);
 -webkit-mask:linear-gradient(to top,#000 0%,transparent 75%);mask:linear-gradient(to top,#000 0%,transparent 75%);animation:wav 5s ease-in-out infinite}
.refl svg{width:100%;height:100%}
@keyframes wav{50%{transform:scaleY(-1) skewX(1.2deg) translateX(4px)}}
.bulb{animation:tw 1.6s infinite}
/* water */
#water{position:absolute;left:0;right:0;top:calc(var(--hz) - 3%);bottom:0;overflow:hidden;opacity:.3;}
#water .rip{will-change:transform;position:absolute;inset:-20% -50%;background:repeating-linear-gradient(0deg,transparent 0 9px,rgba(160,190,255,.05) 9px 10px);animation:flow 9s linear infinite}
#water .rip.b{background:repeating-linear-gradient(178deg,transparent 0 26px,rgba(255,215,140,.04) 26px 28px);animation-duration:16s}
@keyframes flow{to{transform:translateX(160px)}}
.mref{position:absolute;top:0;right:calc(12% + 2vw);width:clamp(40px,6vw,80px);height:100%;background:repeating-linear-gradient(transparent 0 6px,rgba(255,240,190,.55) 6px 9px);filter:blur(3px);-webkit-mask:linear-gradient(#000,transparent 85%);mask:linear-gradient(#000,transparent 85%);animation:shim 2.5s ease-in-out infinite}
@keyframes shim{50%{transform:scaleX(1.5);opacity:.6}}
.bank{position:absolute;left:0;right:0;top:calc(var(--hz) - 6px);height:10px;background:linear-gradient(#0a0f22,transparent)}
/* krathong */
#river{position:absolute;left:0;right:0;top:var(--hz);bottom:0}
.kt{position:absolute;left:0;animation:float linear infinite;will-change:transform;backface-visibility:hidden}

.kt .sc{transform-origin:center bottom;cursor:pointer;position:relative;width:110px}
.kt .bob{position:relative;z-index:2}
@keyframes bob{50%{transform:translateY(-4px) rotate(1.8deg)}}
.kt svg{width:110px;display:block}
.kt .halo{position:absolute;left:50%;top:5%;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(rgba(255,190,90,.38),transparent 62%);animation:fl 1.6s infinite alternate;pointer-events:none}
.kt .streak{position:absolute;left:50%;top:88%;width:34px;height:110px;margin-left:-17px;background:radial-gradient(ellipse at 50% 0,rgba(255,190,90,.45),transparent 70%);border-radius:50%;animation:fl 1.2s infinite alternate;pointer-events:none}
.kt .lbl{position:absolute;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;padding:2px 10px;border-radius:10px;background:rgba(0,0,0,.5);opacity:0;transition:.3s;z-index:3}
.kt:hover .lbl,.kt.mine .lbl{opacity:1}
.kt.mine .lbl{background:linear-gradient(90deg,#ffe08a,#ff9b5a);color:#2b1600;font-weight:600;box-shadow:0 0 12px #ffb35a}
.kt .halo{animation:none!important}.kt.mine .halo{animation:fl 1.6s infinite alternate!important;background:radial-gradient(rgba(255,230,130,.8),transparent 62%);width:210px;height:210px;margin-left:-105px;top:-20%}

@keyframes fl{to{opacity:.55;transform:scale(1.08)}}
.flame{animation:flick .22s infinite alternate;transform-origin:center bottom;transform-box:fill-box}
@keyframes flick{to{transform:scaleY(1.18) scaleX(.88)}}
.firefly{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff6b0;box-shadow:0 0 8px 3px rgba(255,240,150,.7);animation:ff linear infinite}
@keyframes ff{0%,100%{opacity:0}50%{opacity:1;transform:translate(var(--x),var(--y))}}
.lantern{position:absolute;width:16px;height:22px;border-radius:40% 40% 20% 20%;background:radial-gradient(#fff3c4,#ff9d2e 70%);box-shadow:0 0 16px 6px rgba(255,160,50,.5);animation:rise linear forwards}
@keyframes rise{to{transform:translate(var(--dx),-80vh) scale(.3);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8}
/* UI */
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;z-index:9;pointer-events:none}
.ttl h1{font-family:'Charm',cursive;font-size:clamp(20px,min(4.6vw,6.5vh),52px);color:var(--gold);text-shadow:0 0 16px rgba(255,200,90,.8),0 2px 4px #000;line-height:1.1}

.dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:9;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;font:inherit;font-weight:600;font-size:clamp(16px,2.2vw,20px);padding:13px 28px;border-radius:40px;cursor:pointer;color:#2b1600;background:linear-gradient(135deg,#ffe9a8,#f5b942,#ff8f4a);box-shadow:0 0 24px rgba(255,180,70,.7);animation:pulse 2s infinite;white-space:nowrap}

.ic{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,215,122,.6);background:rgba(5,10,30,.78);color:#fff;font-size:22px;cursor:pointer;position:relative}
.ic:hover{background:rgba(255,215,122,.25)}
.ic span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;opacity:.85}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,10,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px;opacity:0;pointer-events:none;transition:.3s}
.modal.show{opacity:1;pointer-events:auto}
.box{background:var(--panel);border:1px solid rgba(255,215,122,.45);border-radius:24px;padding:20px;width:min(560px,100%);max-height:94vh;overflow:auto;box-shadow:0 0 60px rgba(255,190,90,.25);transform:scale(.6) translateY(60px);transition:.45s cubic-bezier(.2,1.6,.4,1);position:relative}
.modal.show .box{transform:none}
.x{position:absolute;top:10px;right:14px;background:none;border:none;color:#fff;font-size:26px;cursor:pointer;opacity:.7}
.box h2{color:var(--gold);text-align:center;font-size:21px;margin-bottom:6px}
#preview{height:150px;border-radius:16px;background:radial-gradient(ellipse at 50% 85%,#25408f,#0a1640 70%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;margin-bottom:12px;overflow:hidden}
#preview svg{width:170px;animation:bob 3.5s ease-in-out infinite}
.step{margin-bottom:11px}
.step>span{font-size:13px;opacity:.85;display:block;margin-bottom:5px}
.opts{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px}
.opt{flex:0 0 auto;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:13px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.opt.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2b1600;border-color:transparent;box-shadow:0 0 12px rgba(255,200,90,.6)}
.opt i{font-style:normal;font-size:16px;margin-right:3px}
.eco{font-size:10px;padding:0 5px;border-radius:6px;background:#2f9e5b;color:#fff;margin-left:3px}
input,textarea{width:100%;font:inherit;padding:10px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:none;height:66px}
.small{font-size:12px;opacity:.7}

#mSvg svg{width:150px}

/* right side panel for make */
#mMake{justify-content:flex-end;align-items:stretch;padding:10px;background:rgba(0,0,10,.25);backdrop-filter:none}
#mMake .box{width:340px;max-height:none;height:100%;padding:14px 14px 12px;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;transform:translateX(110%);transition:.45s cubic-bezier(.2,1.2,.4,1)}
#mMake.show .box{transform:none}

#mMake input,#mMake textarea{padding:7px 10px;font-size:13px;border-radius:10px}
#mMake textarea{height:52px}
#mMake .pdpa{font-size:11px;margin:2px 0 8px}
#mMake .btn{font-size:16px;padding:9px 26px}

#mMake .scroll{flex:1;overflow:auto;min-height:0}
@media(max-width:600px){#mMake{padding:0;align-items:flex-end}#mMake .box{width:100%;height:auto;max-height:88vh;border-radius:18px 18px 0 0;transform:translateY(110%)}}
.sc-badge{pointer-events:auto;display:inline-block;font-size:11px;letter-spacing:2px;font-weight:600;color:var(--cy);text-decoration:none;padding:3px 10px;border:1px solid rgba(62,230,255,.55);border-radius:20px;background:rgba(0,30,50,.45);box-shadow:0 0 12px rgba(62,230,255,.35);margin-bottom:4px}

.box{border-image:none;border-color:rgba(62,230,255,.45)!important;box-shadow:0 0 40px rgba(62,230,255,.18),0 0 60px rgba(255,190,90,.15)!important}
.lamp{animation:fl 2s infinite alternate}

#mMake #preview{height:150px;position:relative;perspective:600px;align-items:center;padding:0}
#pv{position:relative;z-index:2;animation:sway 4s ease-in-out infinite;transform-style:preserve-3d}

@keyframes sway{0%,100%{transform:rotateY(-22deg) translateY(0)}50%{transform:rotateY(22deg) translateY(-5px)}}
#pv.spin{animation:spin 2.6s cubic-bezier(.25,.8,.35,1)}
@keyframes spin{0%{transform:rotateY(0) scale(.5);filter:brightness(2.5)}60%{transform:rotateY(320deg) scale(1.12);filter:brightness(1.3)}100%{transform:rotateY(360deg) scale(1);filter:brightness(1)}}

.ring{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;border:3px solid var(--gold);opacity:0}

function chedi(x,h,s){ // golden chedi

 <path d="M${x-w*.6} ${400-62*s} Q${x-w*.62} ${400-130*s} ${x} ${400-140*s} Q${x+w*.62} ${400-130*s} ${x+w*.6} ${400-62*s}Z" fill="url(#gd)"/>
 <rect x="${x-w*.2}" y="${400-158*s}" width="${w*.4}" height="${18*s}" fill="url(#gd)"/>
 <path d="M${x-w*.17} ${400-158*s} L${x} ${400-h*s} L${x+w*.17} ${400-158*s}Z" fill="url(#gd)"/>
 ${[1,2,3,4,5,6].map(i=>`<ellipse cx="${x}" cy="${400-158*s-i*(h-158)*s/7}" rx="${w*.17*(1-i/7)+1}" ry="${2*s}" fill="#fff2b0" opacity=".7"/>`).join("")}

 return `<path d="M${cx-w} ${y} L${cx} ${y-h} L${cx+w} ${y}Z" fill="${c}"/>
 <path d="M${cx-w-6} ${y+2} L${cx} ${y-h-4} L${cx+w+6} ${y+2}" fill="none" stroke="#ffcc4d" stroke-width="5"/>
 ${[...Array(7)].map((_,i)=>{const t=(i+1)/8;return `<path d="M${cx-w*(1-t)-4} ${y-h*t} l-7 -9 M${cx+w*(1-t)+4} ${y-h*t} l7 -9" stroke="#ffcc4d" stroke-width="3"/>`}).join("")}
 <path d="M${cx} ${y-h-4} q4 -22 18 -26 q-6 6 -6 14" fill="none" stroke="#ffcc4d" stroke-width="5" stroke-linecap="round"/>
 <path d="M${cx-w-6} ${y+2} q-12 -4 -14 -18 M${cx+w+6} ${y+2} q12 -4 14 -18" stroke="#ffcc4d" stroke-width="4" fill="none" stroke-linecap="round"/>`}

 const hy=400-150*s,L=70*s;let b="";
 for(let i=0;i<6;i++){const a=i*60;b+=`<g transform="rotate(${a} ${x} ${hy})"><line x1="${x}" y1="${hy}" x2="${x}" y2="${hy-L}" stroke="#4a3520" stroke-width="${3*s}"/><path d="M${x+2*s} ${hy-12*s} L${x+16*s} ${hy-16*s} L${x+15*s} ${hy-L+2*s} L${x+2*s} ${hy-L}Z" fill="#efe6d2" opacity=".92" stroke="#8a7656" stroke-width="1"/></g>`}
 return `<g><path d="M${x-26*s} 400 L${x-5*s} ${hy} M${x+26*s} 400 L${x+5*s} ${hy} M${x-20*s} ${400-40*s} L${x+20*s} ${400-40*s} M${x-14*s} ${400-90*s} L${x+14*s} ${400-90*s} M${x-22*s} 400 L${x+14*s} ${400-90*s} M${x+22*s} 400 L${x-14*s} ${400-90*s}" stroke="#2e2416" stroke-width="${4*s}" fill="none"/>

 <g>${b}<circle cx="${x}" cy="${hy}" r="${5*s}" fill="#6b4a26"/><animateTransform attributeName="transform" type="rotate" from="0 ${x} ${hy}" to="360 ${x} ${hy}" dur="${d}s" repeatCount="indefinite"/></g></g>`}
function salt(a,b){ // นาเกลือ + กองเกลือ + ยุ้งเกลือ
 let g=`<rect x="${a}" y="386" width="${b-a}" height="12" fill="#6f7fb0" opacity=".55"/>`;
 for(let x=a;x<b;x+=46)g+=`<rect x="${x+2}" y="387" width="42" height="9" fill="#c9d4f0" opacity=".5"/><rect x="${x}" y="386" width="3" height="12" fill="#3d4466"/>`;
 [[.12,22],[.3,30],[.45,18],[.62,26],[.8,20]].forEach(([t,h])=>{const x=a+(b-a)*t;g+=`<path d="M${x-h*1.3} 392 Q${x} ${392-h*1.4} ${x+h*1.3} 392Z" fill="url(#sl)"/>`});
 const hx=a+(b-a)*.5;g+=`<rect x="${hx-28}" y="362" width="56" height="28" fill="#4b3a26"/><path d="M${hx-38} 364 L${hx} 336 L${hx+38} 364Z" fill="#7a6a4a"/><rect x="${hx-6}" y="372" width="12" height="18" fill="#ffb24a" opacity=".85"/>`;
 return g}
function templeSVG(){
 const tree=(x,r,c)=>`<g fill="${c}">${[0,1,2,3,4].map(i=>`<circle cx="${x+Math.cos(i*1.3)*r*.7}" cy="${400-r*1.6-Math.sin(i*1.9)*r*.5}" r="${r*(.7+(i%3)*.15)}"/>`).join("")}<rect x="${x-4}" y="${400-r*1.2}" width="8" height="${r*1.2}"/></g>`;
 let bulbs="";[[180,1420]].forEach(([a,b])=>{for(let i=0;i<=46;i++){const t=i/46,x=a+(b-a)*t,y=150+Math.sin(t*Math.PI*4)**2*0+ (Math.abs(Math.sin(t*Math.PI*3))*-30)+40;bulbs+=`<circle class="bulb" style="animation-delay:${(i%5)*.3}s" cx="${x}" cy="${y+90}" r="3.5" fill="hsl(${(i*37)%360},100%,70%)"/>`}});
 return `<svg viewBox="0 0 1600 400" preserveAspectRatio="xMidYMax slice">
 <defs><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#9c6a14"/><stop offset=".45" stop-color="#ffe08a"/><stop offset="1" stop-color="#a8721a"/></linearGradient>

 ${salt(0,250)}${salt(1350,1600)}${mill(70,1,7)}${mill(200,.7,5)}${mill(1440,.75,6)}${mill(1560,1,8)}${mill(640,.45,4.5)}${mill(1000,.45,5.5)}${tree(560,40,"#0a1430")}${tree(1050,38,"#0a1430")}
 ${chedi(280,250,1.05)}${chedi(1320,250,1.05)}${chedi(460,200,.7)}${chedi(1140,200,.7)}

 <path d="M590 240 L640 205 L960 205 L1010 240Z" fill="url(#rf2)"/><path d="M586 242 L1014 242" stroke="#ffcc4d" stroke-width="4"/>

 <path d="M800 196 L700 205 L800 112 L900 205Z" fill="#c99a2e" opacity=".9"/>

/* ===== Krathong SVG ===== */
const R=i=>{const x=Math.sin(i*127.1)*43758.5;return x-Math.floor(x)};
const arc=(n,from,to,cy,rx,ry)=>[...Array(n)].map((_,i)=>{const t=from+(to-from)*(i/(n-1));return [60+rx*Math.cos(t),cy+ry*Math.sin(t)]});
function pleats(pts,h,c1,c2){return pts.map(([x,y])=>`<path d="M${x-6.5} ${y} L${x} ${y-h} L${x} ${y}Z" fill="${c1}"/><path d="M${x} ${y} L${x} ${y-h} L${x+6.5} ${y}Z" fill="${c2}"/><path d="M${x} ${y} L${x} ${y-h}" stroke="rgba(255,255,255,.25)" stroke-width=".6"/>`).join("")}
function petals(pts,h,w){return pts.map(([x,y])=>`<path d="M${x-w} ${y} Q${x-w-1} ${y-h*.55} ${x} ${y-h} Q${x+w+1} ${y-h*.55} ${x+w} ${y}Z" fill="url(#gPetal)" stroke="#c94a80" stroke-width=".6"/><path d="M${x} ${y-1} Q${x-1} ${y-h*.5} ${x} ${y-h+3}" stroke="rgba(200,60,120,.45)" stroke-width=".7" fill="none"/>`).join("")}

 if(b==="bread")return `<path d="M9 78 Q10 102 60 104 Q110 102 111 78Z" fill="url(#gBread)"/>${[...Array(26)].map((_,i)=>`<circle cx="${16+R(i)*88}" cy="${83+R(i+50)*16}" r="${.6+R(i+9)*.8}" fill="rgba(110,55,15,.4)"/>`).join("")}<ellipse cx="60" cy="78" rx="51" ry="12" fill="url(#gBreadTop)"/>${arc(12,Math.PI,2*Math.PI,78,49,11).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6.5" fill="url(#gCrust)"/>`).join("")}`;
 if(b==="trunk")return `<path d="M10 74 L10 92 A50 12 0 0 0 110 92 L110 74Z" fill="url(#gTrunk)"/>${[...Array(16)].map((_,i)=>{const x=14+i*6.1,u=(x-60)/50,d=12*Math.sqrt(1-u*u);return `<path d="M${x} ${74+d} L${x} ${92+d}" stroke="rgba(80,95,40,.35)" stroke-width=".8"/>`}).join("")}<ellipse cx="60" cy="74" rx="50" ry="12" fill="#f3eed4" stroke="#9cad5c" stroke-width="3"/>${[40,30,20,10].map(r=>`<ellipse cx="60" cy="74" rx="${r}" ry="${r*.24}" fill="none" stroke="#d6cb98" stroke-width=".9"/>`).join("")}${[...Array(14)].map((_,i)=>{const t=i/14*6.28;return `<line x1="60" y1="74" x2="${60+46*Math.cos(t)}" y2="${74+11*Math.sin(t)}" stroke="rgba(200,190,140,.35)" stroke-width=".5"/>`}).join("")}`;
 if(b==="coco")return `<path d="M8 76 Q9 107 60 107 Q111 107 112 76Z" fill="url(#gCoco)"/>${[...Array(40)].map((_,i)=>{const x=12+R(i)*96,y=80+R(i+70)*22;return `<path d="M${x} ${y} q${R(i+3)*4-2} 3 ${R(i+5)*6-3} 6" stroke="rgba(45,22,6,.55)" stroke-width=".7" fill="none"/>`}).join("")}<ellipse cx="60" cy="76" rx="52" ry="12" fill="#f8f3e6" stroke="#3b220c" stroke-width="1.5"/><ellipse cx="60" cy="76.5" rx="47" ry="9.5" fill="#4a2a10"/>`;
 return `<ellipse cx="60" cy="94" rx="57" ry="11" fill="#2f6e2b"/><path d="M60 94 L118 92" stroke="#1d4a1b" stroke-width="1.5"/>${[...Array(9)].map((_,i)=>`<path d="M60 94 L${60+56*Math.cos(i*.7)} ${94+10*Math.sin(i*.7)}" stroke="rgba(150,210,120,.3)" stroke-width=".6"/>`).join("")}<ellipse cx="60" cy="80" rx="46" ry="11" fill="#f7b9d3"/>${petals(arc(9,Math.PI,2*Math.PI,80,46,11),24,7)}`;

function baseFront(b){
 if(b==="banana")return pleats(arc(11,Math.PI,0,79,51,12),18,"#6cb85a","#357d34");
 if(b==="bread")return arc(12,Math.PI,0,80,50,12).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="url(#gCrust)"/><ellipse cx="${x-2}" cy="${y-3}" rx="2.5" ry="1.5" fill="rgba(255,240,200,.5)"/>`).join("");

 s+=`<g transform="translate(60 57)">${[0,45,90,135,180,225,270,315].map(a=>`<ellipse rx="6" ry="13" fill="${f}" opacity=".95" transform="rotate(${a}) translate(0 -8)"/>`).join("")}<circle r="6" fill="#ffd34d"/></g>`;

 if(k.candle==="triple")[44,76,68].forEach((x,i)=>s+=`<line x1="${x}" y1="56" x2="${x+(i-1)*3}" y2="${24+i*3}" stroke="#a5332b" stroke-width="2"/><circle cx="${x+(i-1)*3}" cy="${24+i*3}" r="1.8" fill="#ff5a2a"/>`);

// slot: -1 = ซ้าย, 0 = กลาง, 1 = ขวา · stage.berm ใน BGS = เส้นขอบคันนาเกลือ [x1,y1,x2,y2], stage.h = ความสูงตัวละคร (พิกเซลของภาพฉาก) · delay = เวลาไสลด์ขึ้น (ms)
const CHARS=[{id:"lady",slot:-1,AR:241/620,delay:1000},{id:"man",slot:1,AR:219/620,delay:2600},{id:"man2",slot:0,AR:228/620,delay:4200}];
let curBg="";
function fitBg(){const W=innerWidth,H=innerHeight,ar=W/H,b=ar<.8?BGS[0]:ar<1.55?BGS[1]:BGS[2];
 if(b.src!==curBg){curBg=b.src;$("bg").style.backgroundImage=`url(${b.src})`;$("piles").style.backgroundImage=`url(${b.ov})`}
 const k=Math.max(W/b.w,H/b.h),ih=b.h*k,tk=($("ticker")||{}).offsetHeight||34,
  oy=Math.min(0,Math.max(H-ih,tk+30-b.moon*k)),wy=b.water*ih+oy;   // ชิดล่าง แต่เลื่อนลงให้พระจันทร์ไม่ติดขอบบน
 let ox=(W-b.w*k)/2;const lx=b.piles[2][0]*k+ox;if(lx<45)ox=Math.max(W-b.w*k,Math.min(0,ox+45-lx)); // ให้เห็นกองแรกบนจอแคบ
 $("bg").style.backgroundPosition=$("piles").style.backgroundPosition=`${ox}px ${oy}px`;
 CHARS.forEach(c=>placeChar(c,b,k,ox,oy,W));
 document.documentElement.style.setProperty("--hz",Math.min(80,Math.max(35,wy/H*100+1))+"%")}
// ยืนเรียงกึ่งกลางจอบนคันนาริมน้ำ: ผู้หญิง (ซ้าย) · ชุดม่วง (กลาง) · ชุดเขียว (ขวา)
function placeChar(c,b,k,ox,oy,W){const L=b.stage.h*k,w=L*c.AR,gap=L*.42,cx=W/2+c.slot*gap,[x1,y1,x2,y2]=b.stage.berm,
 ix=(cx-ox)/k,foot=(y1+(y2-y1)*(ix-x1)/(x2-x1))*k+oy,el=$(c.id);   // เท้าวางบนแนวคันนาเกลือ ณ ตำแหน่งจริงของแต่ละคน
 Object.assign(el.style,{left:(cx-w/2)+"px",top:(foot-L)+"px",width:w+"px",height:L+"px",zIndex:c.slot?2:3})}
fitBg();addEventListener("resize",fitBg);CHARS.forEach(c=>setTimeout(()=>{$(c.id).classList.add("up");setTimeout(()=>{const r=$(c.id).getBoundingClientRect();for(let i=0;i<26;i++){const a=Math.random()*6.28,v=1+Math.random()*2.5;P.push({x:r.left+r.width/2,y:r.bottom-6,vx:Math.cos(a)*v,vy:-Math.abs(Math.sin(a)*v),l:40+Math.random()*20,c:i%2?"#ffe08a":"#3ee6ff"})}},2100)},c.delay));
const river=$("river");
/* ลอยไปทางขวา + โยกขึ้นลง รวมในแอนิเมชันเดียว (ลื่นกว่าแอนิเมชันซ้อน) */
(function(){const N=80,st=document.createElement("style");let k="@keyframes float{";
 for(let i=0;i<=N;i++){const t=i/N;k+=`${(t*100).toFixed(2)}%{transform:translate3d(calc(-160px + (100vw + 220px) * ${t.toFixed(4)}),${i%2?-4:0}px,0) rotate(${i%2?1.5:0}deg)}`}
 st.textContent=k+"}";document.head.appendChild(st)})();
function LS(sc){return Math.min(1,Math.max(.55,sc*1.1))/sc}

const RV=[];
function layout(){const n=RV.length,k=VK();RV.forEach((el,i)=>{const t=n>1?i/(n-1):0,y=Math.max(1,Math.min(84,2+80*Math.pow(1-t,1.35)+(+el.dataset.j))),sc=(.2+Math.pow(y/83,1.25)*.95)*k;
 el.style.top=y+"%";el.style.zIndex=Math.round(y)+(el.classList.contains("mine")?100:0);const s=el.firstElementChild;s.style.transform=`translateY(-85%) scale(${sc})`;s.style.setProperty("--ls",LS(sc))})}
function addToRiver(k,first){

 el.className="kt"+(m?" mine":"");el.dataset.id=k.id;el.dataset.j=(Math.random()*4-2).toFixed(2);
 el.style.animationDuration=dur+"s";el.style.animationDelay=(first?-Math.random()*dur:-dur*(.05+Math.random()*.1))+"s";

  const el=addToRiver(k,false);
  burst(6);for(let i=0;i<10;i++)setTimeout(lantern,i*220);
  toast("🎉 ลอยกระทงสำเร็จ! ขอให้สมความปรารถนา ⭐");$("wish").value="";$("wc").textContent="0/200";photo=null;$("photo").value="";$("phImg").innerHTML="📷<small>อัปโหลด</small>";
 }catch(e){toast("ส่งไม่สำเร็จ: "+(e.message||"ลองใหม่อีกครั้ง"))}
 setTimeout(()=>{busy=false;$("go").disabled=false},5000);
}

/* ===== Effects ===== */
const cv=$("fx"),cx=cv.getContext("2d");let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",rs);rs();
function firework(x,y){const h=Math.random()*360;for(let i=0;i<80;i++){const a=Math.random()*6.28,v=1+Math.random()*4.2;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60+Math.random()*35,c:`hsl(${h+Math.random()*40},100%,${60+Math.random()*20}%)`})}}
function burst(n=1){for(let i=0;i<n;i++)setTimeout(()=>firework(innerWidth*(.12+Math.random()*.76),innerHeight*(.08+Math.random()*.25)),i*380)}
let looping=false;
function loop(){if(!P.length){cx.clearRect(0,0,cv.width,cv.height);looping=false;return}
 cx.globalCompositeOperation="destination-out";cx.fillStyle="rgba(0,0,0,.22)";cx.fillRect(0,0,cv.width,cv.height);cx.globalCompositeOperation="lighter";
 P.splice(0,P.length,...P.filter(p=>p.l-->0));for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/40);cx.fillRect(p.x-1.5,p.y-1.5,3,3)}
 cx.globalAlpha=1;requestAnimationFrame(loop)}
const _push=P.push;P.push=function(...a){if(P.length>600)return P.length;const r=_push.apply(P,a);if(!looping){looping=true;requestAnimationFrame(loop)}return r};
function sparkle(box){const r=box.getBoundingClientRect();for(let i=0;i<16;i++){const a=Math.random()*6.28,v=1+Math.random()*2.2;P.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:40,c:"#ffe08a"})}}
const sky=$("sky");
function lantern(){const l=document.createElement("div");l.className="lantern";l.style.left=Math.random()*100+"%";l.style.bottom="-10px";l.style.setProperty("--dx",(Math.random()*160-80)+"px");l.style.animationDuration=(16+Math.random()*10)+"s";sky.appendChild(l);setTimeout(()=>l.remove(),27000)}
for(let i=0;i<40;i++){const s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*70+"%";s.style.animationDelay=Math.random()*3+"s";s.style.opacity=.3+Math.random()*.7;sky.appendChild(s)}
for(let i=0;i<8;i++){const f=document.createElement("div");f.className="firefly";f.style.left=Math.random()*100+"%";f.style.top=(40+Math.random()*25)+"%";f.style.setProperty("--x",(Math.random()*80-40)+"px");f.style.setProperty("--y",(Math.random()*-60)+"px");f.style.animationDuration=(4+Math.random()*5)+"s";f.style.animationDelay=-Math.random()*8+"s";$("scene").appendChild(f)}
setInterval(()=>{if(!document.hidden&&document.querySelectorAll(".lantern").length<8)lantern()},3200);setInterval(()=>burst(1),8000);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),3500)}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

$("portal").href=CONFIG.PORTAL_URL;
function today(){const d=new Date().toDateString();$("today").textContent=data.filter(k=>k.created_at&&new Date(k.created_at).toDateString()===d).length}
async function share(){const u=location.href,t="มาลอยกระทงออนไลน์กับเทศบาลตำบลคลองตำหรุ 🪷";
 try{if(navigator.share)await navigator.share({title:t,text:t,url:u});else{await navigator.clipboard.writeText(u);toast("📋 คัดลอกลิงก์แล้ว")}}catch(e){}}
preview();load().then(today);
const POLL=CONFIG.POLL_SEC*1000;let since="";
async function poll(){if(document.hidden)return;try{
 since=data.reduce((m,d)=>d.created_at>m?d.created_at:m,since);
 const r=await fetch(CONFIG.API_URL+"?since="+encodeURIComponent(since)+"&t="+Date.now()),j=await r.json(),ids=new Set(data.map(d=>String(d.id)));
 const fresh=(j.rows||[]).filter(k=>!ids.has(String(k.id)));total=Math.max(total,j.total||0);$("count").textContent=total;
 if(fresh.length){data.unshift(...fresh);data.length=Math.min(data.length,CONFIG.SHOW);fresh.slice().reverse().forEach(k=>addToRiver(k,false));ticker();today();if(fresh.length<4)toast("🪷 "+fresh.map(k=>k.name).join(", ")+" เพิ่งลอยกระทง")}}catch(e){}}
if(useDB){setInterval(poll,POLL);document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()})}

/* ===== ดนตรีคลอ: สังเคราะห์สดด้วย Web Audio (บันไดเสียงไทยเพนทาโทนิก ขิม + ฉิ่ง + โดรน) เล่นวนไม่สิ้นสุด ===== */
const MUSIC={on:true,ctx:null,out:null,next:0,step:0,deg:4,timer:null};
function mStart(){if(MUSIC.ctx){MUSIC.ctx.resume();return}
 const C=new (window.AudioContext||window.webkitAudioContext)(),out=C.createGain();out.gain.value=0;out.connect(C.destination);
 out.gain.linearRampToValueAtTime(.22,C.currentTime+3);
 const rv=C.createConvolver(),len=C.sampleRate*3,ir=C.createBuffer(2,len,C.sampleRate);
 for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
 rv.buffer=ir;const wet=C.createGain();wet.gain.value=.45;rv.connect(wet);wet.connect(out);
 const bus=C.createGain();bus.connect(out);bus.connect(rv);
 [65.41,98].forEach(f=>{const o=C.createOscillator(),g=C.createGain(),l=C.createOscillator(),lg=C.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.05;
  l.frequency.value=.07;lg.gain.value=.025;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(bus);o.start();l.start()});
 Object.assign(MUSIC,{ctx:C,out:bus,next:C.currentTime+.3});MUSIC.timer=setInterval(mSched,100)}
const SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880];
function pluck(f,t,v){const C=MUSIC.ctx;[1,2.01].forEach((m,i)=>{const o=C.createOscillator(),g=C.createGain();o.type=i?"sine":"triangle";o.frequency.value=f*m;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v/(i?3:1),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+(i?.6:1.6));o.connect(g);g.connect(MUSIC.out);o.start(t);o.stop(t+1.7)})}
function ching(t,open){const C=MUSIC.ctx;[2793,3520,4186].forEach(f=>{const o=C.createOscillator(),g=C.createGain();o.frequency.value=f;
 g.gain.setValueAtTime(.018,t);g.gain.exponentialRampToValueAtTime(.0001,t+(open?1.4:.12));o.connect(g);g.connect(MUSIC.out);o.start(t);o.stop(t+1.5)})}
function mSched(){const C=MUSIC.ctx,beat=60/68/2;while(MUSIC.next<C.currentTime+.4){const t=MUSIC.next,s=MUSIC.step%16;
 if(Math.random()<(s%2?.55:.9)){MUSIC.deg=Math.max(0,Math.min(SCALE.length-1,MUSIC.deg+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));
  pluck(SCALE[MUSIC.deg],t,.09);if(s%4===0)pluck(SCALE[Math.max(0,MUSIC.deg-3)]/2,t,.06)}
 if(s%4===0)ching(t,s%8===0);if(s===0&&Math.random()<.5)MUSIC.deg=4;
 MUSIC.next+=beat*(s%2?.92:1.08);MUSIC.step++}}
/* เล่นทันที: ลองเปิดเสียงตั้งแต่โหลดหน้า ถ้าเบราว์เซอร์บล็อก จะเริ่มเองเมื่อผู้ใช้แตะ/เลื่อน/คลิกครั้งแรกที่ใดก็ได้ */
try{mStart()}catch(e){}
const kick=()=>{try{mStart();if(MUSIC.ctx&&MUSIC.ctx.state==="running")KE.forEach(ev=>removeEventListener(ev,kick,true))}catch(e){}};
const KE=["pointerdown","touchstart","touchend","click","keydown","wheel","scroll"];KE.forEach(ev=>addEventListener(ev,kick,{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(!MUSIC.ctx)return;if(document.hidden)MUSIC.ctx.suspend();else if(MUSIC.on)MUSIC.ctx.resume()});
</script>
